[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-vlm-experiments"
version = "0.1.0"
description = "Structured ViT, VLM, and VLA experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
vla = ["lerobot"]

[tool.setuptools.packages.find]
where = ["src"]
