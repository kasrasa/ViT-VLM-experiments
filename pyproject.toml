[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vit-vlm-experiments"
version = "0.1.0"
description = "Structured ViT, VLM, and VLA experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torchvision (<0.29)",
]

[project.optional-dependencies]
vla = ["lerobot[dataset]"]

[tool.setuptools.packages.find]
where = ["src"]
